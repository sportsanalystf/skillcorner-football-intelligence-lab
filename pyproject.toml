[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-intelligence-lab"
version = "1.0.0"
description = "An open-source football analytics platform combining broadcast tracking, dynamic events, physical performance and 3D body pose"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faizan Khan" }]
keywords = ["football", "soccer", "tracking-data", "sports-analytics", "skillcorner"]

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "polars>=1.0",
  "orjson>=3.9",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "plotly>=5.20",
  "matplotlib>=3.8",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40", "jupyter>=1.0"]

[project.urls]
"SkillCorner Open Data" = "https://github.com/SkillCorner/opendata"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501", "N803", "N806"]
